# Jaw geometry. Loaded into /jaws. Lengths m, angles deg.

mount_to_throat_m: 0.0400                # jaw mount face to where the blades meet, along the wrist axis
mount_to_tip_m: 0.0969                   # jaw mount face to the blade tips, along the wrist axis
palm_length_m: 0.00975                   # palm cylinder in front of the mount
hinge_roll_at_wrist_zero_deg: -60.0      # roll of the blade hinge axis when the wrist reads zero
open_width_m: 0.007                      # jaw opening at home and while moving; the collision body uses it too
blade_rotation_rad_per_m: 51.0           # each blade swings this far per metre of jaw opening
hinge_offset_closing_m: 0.0155           # blade hinge from the wrist axis, across the jaws
hinge_offset_approach_m: 0.0069          # blade hinge in front of the mount face

# Blade shape from the vendor meshes, one row per 5 mm band: [approach_min, approach_max, closing_min, closing_max, hinge_half_width]
