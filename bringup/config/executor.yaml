# Path execution. Loaded into /executor. Angles deg, times s.

rate_hz: 5.0                             # waypoints sent per second
max_joint_step_deg: 1.0                  # largest joint change between waypoints, so the speed limit is rate_hz * this
start_tolerance_deg: 2.0                 # refuse a path that starts further than this from where the arm is
arrival_tolerance_deg: 1.5               # every joint within this of the last waypoint counts as arrived
feedback_timeout_s: 0.5                  # joint_states older than this are ignored
arrival_timeout_s: 15.0                  # after the last waypoint, give up and release the arm if not arrived by then

blocked_detection:                       # a joint that stops following while commanded means the arm hit something
  min_commanded_step_deg: 0.2            # only joints asked to move at least this far are watched
  min_follow_fraction: 0.2               # moving less than this fraction of the command is a strike
  strikes: 10                            # consecutive strikes before stopping
