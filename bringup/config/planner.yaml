# Grasp and path planning. Loaded into /planner. Lengths m, angles deg, times s.

safety_floor_z_m: -1.0e-6                # no part of the arm may go below this height in arm_base
link_radius_m: 0.020                     # collision radius around the upper arm, forearm, wrist tube and palm
link_sample_step_m: 0.002                # spacing of collision samples along each link
blade_sample_step_m: 0.0025              # spacing of collision samples over the jaw blades
grasp_point_from_mount_m: 0.050          # where the handle sits between the blades: 0.040 is the throat, 0.0969 the tips
max_approach_deviation_deg: 0.0          # 0 turns the check off; otherwise the jaw must come in within this angle of the candidate's approach
start_tolerance_deg: 1.5                 # a start reading this far past a joint limit is treated as on the limit
joint_state_timeout_s: 0.5               # the start pose must come from joint_states newer than this

joint_cost_weights: {base: 1.0, shoulder: 1.0, elbow: 1.0, wrist: 1.0}  # cost = sum of weight * joint travel

paths_to_compare: 5                      # plan paths to this many of the cheapest-looking grasps, keep the cheapest path
max_planning_time_s: 10.0                # stop trying more grasps after this

rrt:                                     # bi-directional RRT*
  max_iterations: 3000
  refine_iterations: 300                 # keep improving this many iterations after the first path
  time_budget_s: 0.5                     # per grasp
  extend_step_deg: 57.2958               # longest single tree extension
  rewire_gamma: 1.0                     # scales the rewiring radius
  edge_check_step_deg: 1.0               # collision checks along every edge, no joint moves further between checks
  shortcut_attempts: 100
  random_seed: 1                         # fixed so the same scene gives the same path
